<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGI Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 font-sans">

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Admin Login</h2>
            <input type="password" id="password-input" placeholder="Enter Password"
                class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="checkLogin()"
                class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 transition font-semibold">
                Access Dashboard
            </button>
            <p id="login-error" class="text-red-500 text-sm mt-3 text-center hidden">Invalid Password</p>
        </div>
    </div>

    <!-- DASHBOARD CONTENT -->
    <div id="dashboard-content" class="hidden min-h-screen">
        <!-- Sidebar -->
        <aside class="fixed left-0 top-0 h-full w-64 bg-slate-800 text-white p-6 hidden md:block">
            <div class="text-2xl font-bold mb-10 flex items-center gap-2">
                <i class="fas fa-robot text-blue-400"></i> DGI Admin
            </div>
            <nav class="space-y-4">
                <button onclick="switchTab('dashboard')"
                    class="w-full flex items-center gap-3 text-blue-400 bg-slate-700 p-3 rounded-lg text-left">
                    <i class="fas fa-chart-line"></i> Dashboard
                </button>
                <button onclick="clearData()"
                    class="w-full flex items-center gap-3 text-red-400 hover:text-white p-3 rounded-lg text-left hover:bg-slate-700 transition">
                    <i class="fas fa-trash-alt"></i> Clear Data
                </button>
                <button onclick="logout()"
                    class="w-full flex items-center gap-3 text-gray-400 hover:text-white p-3 rounded-lg text-left hover:bg-slate-700 transition mt-auto">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="md:ml-64 p-8">
            <!-- Header -->
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Overview</h1>
                    <p class="text-gray-500">Welcome back, Admin</p>
                </div>
                <button onclick="refreshData()" class="p-2 text-gray-600 hover:text-blue-600 transition"
                    title="Refresh Data">
                    <i class="fas fa-sync-alt fa-lg"></i>
                </button>
            </header>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <!-- Total Queries -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-gray-500 text-sm">Total Queries</p>
                            <h3 class="text-3xl font-bold text-gray-800 mt-1" id="total-chats">0</h3>
                        </div>
                        <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">
                            <i class="fas fa-comments"></i>
                        </div>
                    </div>
                </div>

                <!-- Leads Captured -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-gray-500 text-sm">Leads Captured</p>
                            <h3 class="text-3xl font-bold text-gray-800 mt-1" id="total-leads">0</h3>
                        </div>
                        <div class="p-3 bg-green-50 text-green-600 rounded-lg">
                            <i class="fas fa-user-check"></i>
                        </div>
                    </div>
                </div>

                <!-- Queries Today -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-gray-500 text-sm">Queries Today</p>
                            <h3 class="text-3xl font-bold text-gray-800 mt-1" id="queries-today">0</h3>
                        </div>
                        <div class="p-3 bg-purple-50 text-purple-600 rounded-lg">
                            <i class="fas fa-calendar-day"></i>
                        </div>
                    </div>
                    <p class="text-gray-400 text-sm mt-4">Since midnight</p>
                </div>
            </div>

            <!-- Charts -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-800 mb-4">Daily Traffic (Last 7 Days)</h3>
                    <canvas id="trafficChart" height="200"></canvas>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-800 mb-4">Query Topics</h3>
                    <div class="h-64 flex justify-center">
                        <canvas id="topicsChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Tables -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="border-b border-gray-100">
                    <nav class="flex">
                        <button onclick="switchTab('leads')" id="tab-leads"
                            class="px-6 py-4 text-blue-600 border-b-2 border-blue-600 font-medium">Student
                            Leads</button>
                        <button onclick="switchTab('logs')" id="tab-logs"
                            class="px-6 py-4 text-gray-500 hover:text-gray-700 font-medium">Chat Logs</button>
                    </nav>
                </div>

                <div id="view-leads" class="p-6">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-gray-400 text-sm border-b border-gray-100">
                                <th class="pb-3 font-medium">Phone Number</th>
                                <th class="pb-3 font-medium">Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="leads-table-body" class="text-gray-600"></tbody>
                    </table>
                </div>

                <div id="view-logs" class="p-6 hidden">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-gray-400 text-sm border-b border-gray-100">
                                <th class="pb-3 font-medium w-1/3">User Message</th>
                                <th class="pb-3 font-medium w-1/3">Bot Response</th>
                                <th class="pb-3 font-medium">Time</th>
                            </tr>
                        </thead>
                        <tbody id="logs-table-body" class="text-gray-600 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Login
        function checkLogin() {
            const pass = document.getElementById('password-input').value;
            if (pass === 'admin123') {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                loadDashboardData();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        // Logout
        function logout() {
            document.getElementById('dashboard-content').classList.add('hidden');
            document.getElementById('login-overlay').classList.remove('hidden');
            document.getElementById('password-input').value = '';
            document.getElementById('login-error').classList.add('hidden');
        }

        // Clear Data
        async function clearData() {
            if (confirm("WARNING: Are you sure you want to delete ALL data? This cannot be undone.")) {
                try {
                    const res = await fetch('/api/clear_data', { method: 'DELETE' });
                    const data = await res.json();
                    if (data.message) {
                        alert("All data has been cleared.");
                        loadDashboardData(); // Refresh view
                    } else {
                        alert("Error clearing data: " + data.error);
                    }
                } catch (e) {
                    console.error("Error:", e);
                    alert("Failed to clear data.");
                }
            }
        }

        // Tabs
        function switchTab(tab) {
            const leadsView = document.getElementById('view-leads');
            const logsView = document.getElementById('view-logs');
            const leadsTab = document.getElementById('tab-leads');
            const logsTab = document.getElementById('tab-logs');

            if (tab === 'leads') {
                leadsView.classList.remove('hidden');
                logsView.classList.add('hidden');
                leadsTab.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                leadsTab.classList.remove('text-gray-500');
                logsTab.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                logsTab.classList.add('text-gray-500');
            } else if (tab === 'logs') {
                leadsView.classList.add('hidden');
                logsView.classList.remove('hidden');
                logsTab.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                logsTab.classList.remove('text-gray-500');
                leadsTab.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                leadsTab.classList.add('text-gray-500');
            }
        }

        // Data
        async function loadDashboardData() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                document.getElementById('total-chats').innerText = data.total_chats;
                document.getElementById('total-leads').innerText = data.total_leads;
                document.getElementById('queries-today').innerText = data.queries_today;

                // Leads Table
                document.getElementById('leads-table-body').innerHTML = data.leads.map(l => `
                    <tr class="border-b border-gray-50 last:border-0 hover:bg-gray-50">
                        <td class="py-3 font-medium text-gray-800">${l.phone}</td>
                        <td class="py-3 text-sm">${new Date(l.time).toLocaleString()}</td>
                    </tr>
                `).join('');

                // Logs Table
                document.getElementById('logs-table-body').innerHTML = data.chats.map(c => `
                    <tr class="border-b border-gray-50 last:border-0 hover:bg-gray-50">
                        <td class="py-3 pr-4">${c.user}</td>
                        <td class="py-3 pr-4 text-gray-500">${c.bot.substring(0, 100)}...</td>
                        <td class="py-3 text-xs text-gray-400">${new Date(c.time).toLocaleTimeString()}</td>
                    </tr>
                `).join('');

                renderCharts(data.traffic_labels, data.traffic_data, data.topic_labels, data.topic_data);

            } catch (e) {
                console.error("Error:", e);
            }
        }

        function refreshData() { loadDashboardData(); }

        // Charts
        let trafficChart, topicsChart;
        function renderCharts(tLabels, tData, tpLabels, tpData) {
            if (trafficChart) trafficChart.destroy();
            if (topicsChart) topicsChart.destroy();

            trafficChart = new Chart(document.getElementById('trafficChart'), {
                type: 'bar',
                data: {
                    labels: tLabels,
                    datasets: [{ label: 'Queries', data: tData, backgroundColor: '#3B82F6', borderRadius: 4 }]
                },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

            topicsChart = new Chart(document.getElementById('topicsChart'), {
                type: 'doughnut',
                data: {
                    labels: tpLabels,
                    datasets: [{ data: tpData, backgroundColor: ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#6B7280'], borderWidth: 0 }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
        }

        // Auto-refresh data every 3 seconds if dashboard is visible
        setInterval(() => {
            if (!document.getElementById('dashboard-content').classList.contains('hidden')) {
                refreshData();
            }
        }, 3000);
    </script>
</body>

</html>
